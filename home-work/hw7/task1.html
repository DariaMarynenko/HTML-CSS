<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
  <style>
    *{
      margin: 0;
      padding: 0;
    }
    body{
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .cards{
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 145px;
    }
    .logo{
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100px;
      height: 100px;
      border: 4px solid;
      border-color: #554C4C;
      border-radius: 50%;
      position: absolute;
      top: -58px;
      background-color: #FFFFFF;
    }
    .logo-chess{
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100px;
      height: 100px;
      border: 4px solid;
      border-color: #65856E;
      border-radius: 50%;
      position: absolute;
      top: -58px;
      background-color: #FFFFFF;
    }
    .computer-games{
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      width: 319px;
      height: 492px;
      border-width: 4px;
      border: 4px solid;
      border-color: #554C4C;
      position: relative;
      background-color: #D9D9D94D;
    }
    .chess{
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      width: 319px;
      height: 492px;
      border-width: 4px;
      border: 4px solid;
      border-color: #65856E;
      position: relative;
      background-color: #D9D9D94D;
    }
    .battle{
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      width: 319px;
      height: 492px;
      border-width: 4px;
      border: 4px solid;
      border-color: #554C4C;
      position: relative;
      background-color: #D9D9D94D;
    }
    img{
      width: 60px;
      height: 60px;
    }
    h5{
      font-family: Inter, sans-serif;
      font-weight: 400;
      font-style: normal;
      font-size: 40px;
      line-height: normal;
      color: #000000;
      width: 119px;
      height: 48px;
      top: 444px;
      left: 244px;
    }
    p{
      font-family: Inter, sans-serif;
      font-weight: 400;
      font-style: normal;
      font-size: 20px;
      line-height: normal;
      text-align: center;
      color: #000000;
      width: 211px;
      height: 72px;
      top: 496px;
      left: 199px;
    }
  </style>
</head>
<body>
<div class="cards">
  <div class="computer-games">
    <div class="logo">
      <img src="logos/computer-games.png" alt="">
    </div>
    <h5>Lorem</h5>
    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit</p>
  </div>
  <div class="chess">
    <div class="logo-chess">
      <img src="logos/chess.png" alt="">
    </div>
    <h5>Lorem</h5>
    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit</p>
  </div>
  <div class="battle">
    <div class="logo">
      <img src="logos/battle.png" alt="">
    </div>
    <h5>Lorem</h5>
    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit</p>
  </div>
</div>
</body>
</html>
